spring.datasource.url=jdbc:mysql://vehicle-db:3306/vehicle_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=trivio
spring.datasource.password=${TRIVIO_DB_PASSWORD}
# Manual approval and the additive SQL migration are required before activation.
# Never let a service restart implicitly alter the existing MySQL schema.
spring.jpa.hibernate.ddl-auto=validate
