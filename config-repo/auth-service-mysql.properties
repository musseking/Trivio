spring.datasource.url=jdbc:mysql://users-db:3306/users_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=trivio
spring.datasource.password=${TRIVIO_DB_PASSWORD}

# Database schema changes are managed through versioned SQL migrations.
# Hibernate validates the schema without modifying it.
spring.jpa.hibernate.ddl-auto=validate