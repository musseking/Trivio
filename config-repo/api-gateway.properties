server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.cloud.gateway.server.webmvc.routes[0].id=vehicle-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://vehicle-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/vehicles/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[1].id=order-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[2].id=payment-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[3].id=auth-route
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1
